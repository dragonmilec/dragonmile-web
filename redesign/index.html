<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ee" />
    <meta name="description" content="爵邁有限公司 Dragon Mile，自 2019 年專注於 APP 開發、資料庫管理、物聯網解決方案與原理圖及 PCB 設計。" />
    <link rel="icon" type="image/png" href="/assets/brand.png" />
    <title>爵邁有限公司 Dragon Mile｜技術整合・專業實踐</title>
    <script>
      // Prepare every home load before paint. Static HTML stays readable
      // without JavaScript; a failed module cannot leave credentials masked.
      (function () {
        try {
          if (location.pathname !== '/' || location.hash || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          document.documentElement.dataset.credentialsOpening = 'pending';
          setTimeout(function () { delete document.documentElement.dataset.credentialsOpening; }, 3200);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
